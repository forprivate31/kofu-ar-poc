<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>甲府城AR PoC - 山手御門</title>

  <!-- A-Frame / AR.js (CDN経由) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }

    #info-panel {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.5;
      transition: opacity 0.4s, transform 0.4s;
    }

    #info-panel.collapsed {
      opacity: 0;
      transform: translateY(-100%);
      pointer-events: none;
    }

    #info-toggle {
      position: fixed;
      top: 10px; right: 10px;
      z-index: 1000;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      font-size: 14px;
      display: none;
    }

    #info-toggle.visible {
      display: block;
    }

    #start-button {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 16px 28px;
      font-size: 16px;
      background: #b5342a;
      color: #fff;
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* 許可ダイアログの前に見せる説明モーダル */
    #permission-explainer {
      position: fixed;
      inset: 0;
      z-index: 1001;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #permission-explainer .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px 20px;
      max-width: 340px;
      text-align: left;
      line-height: 1.7;
      color: #222;
    }

    #permission-explainer .card h2 {
      font-size: 17px;
      margin: 0 0 12px;
    }

    #permission-explainer .card p {
      font-size: 14px;
      margin: 0 0 10px;
    }

    #permission-explainer .highlight {
      display: inline-block;
      background: #1ec8e6;
      color: #003;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
    }

    #permission-explainer button {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      background: #b5342a;
      color: #fff;
      border: none;
      border-radius: 8px;
    }

    #bottom-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px 20px;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0));
    }

    #distance-indicator {
      text-align: center;
      color: #fff;
      text-shadow: 0 0 4px #000, 0 0 4px #000;
      font-size: 13px;
      line-height: 1.6;
    }

    #camera-status {
      text-align: center;
      color: #ff6b6b;
      text-shadow: 0 0 4px #000, 0 0 4px #000;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <button id="info-toggle">ℹ️</button>

  <div id="info-panel">
    <strong>甲府城AR PoC(近景・遠景・導線 統合版)</strong><br>
    近景:清水櫓(推定復元)/ 境界ライン(象徴表示)<br>
    遠景:稲荷櫓(実在・確定)<br>
    導線:山手御門(実物への案内)<br>
    柳沢吉保時代(1700年頃)を想定。距離表示・仮モデルでの精度確認テストです。
  </div>

  <button id="start-button">ARを開始する(位置情報・カメラを許可)</button>

  <div id="permission-explainer">
    <div class="card">
      <h2>この後、iPhoneの確認画面が出ます</h2>
      <p>
        次に、<strong>英語の確認メッセージ</strong>が表示されます。
        これはiPhone自体の標準機能で、あやしいものではありません。
      </p>
      <p>
        スマホの向き(方位)を使って、実際の景色に江戸時代の門を
        重ねて表示するために必要です。
      </p>
      <p>
        表示されたら、必ず <span class="highlight">Allow(許可)</span> を
        タップしてください。
      </p>
      <button id="proceed-button">次へ進む</button>
    </div>
  </div>

  <div id="bottom-panel">
    <div id="camera-status"></div>
    <div id="distance-indicator"></div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true"
    style="display:none;"
    id="ar-scene"
  >
    <a-camera gps-new-camera="gpsMinDistance: 0" rotation-reader></a-camera>

    <!--
      山手御門(仮モデル・Ver.2)
      実際は「山手門(高麗門・小さめの門)」と「山手渡櫓門(2階建ての櫓門)」の
      2つの構造物からなる複合門。石垣の上に建っている。
      正確な寸法・質感は現地実測・撮影後に更新すること。
      色は白漆喰(壁)+黒瓦(屋根)+木部(柱・扉)のコントラストを仮再現。
    -->
    <a-entity
      gps-new-entity-place="latitude: 35.667226; longitude: 138.570866;"
      id="yamate-gomon-placeholder"
    >
      <!-- 石垣(土台・野面積みイメージ) -->
      <a-box
        position="0 1 0"
        width="16" height="2" depth="10"
        color="#8a8478"
      ></a-box>

      <!-- ① 山手門(高麗門・手前の小さい門) -->
      <a-entity position="0 2 4">
        <!-- 木部の柱・扉 -->
        <a-box position="0 1.5 0" width="4" height="3" depth="1.2" color="#5a4632"></a-box>
        <!-- 小さめの切妻屋根(黒瓦) -->
        <a-box position="0 3.2 0" width="4.6" height="0.4" depth="1.8" color="#2b2b2b"></a-box>
      </a-entity>

      <!-- ② 山手渡櫓門(奥の大きい2階建て櫓門) -->
      <a-entity position="0 2 -2">
        <!-- 1階部分(木部・門扉) -->
        <a-box position="0 1.5 0" width="9" height="3" depth="3" color="#5a4632"></a-box>
        <!-- 2階部分(白漆喰の壁) -->
        <a-box position="0 4.2 0" width="10" height="2.5" depth="3.6" color="#f5f2e9"></a-box>
        <!-- 寄棟屋根(黒瓦) -->
        <a-cone
          position="0 6" radius-bottom="7.5" radius-top="0"
          height="2.4" segments-radial="4" rotation="0 45 0"
          color="#2b2b2b"
        ></a-cone>
      </a-entity>

      <!-- ラベル -->
      <a-text
        value="山手御門(仮・柳沢吉保時代)"
        position="0 9 0"
        align="center"
        color="#ffffff"
        width="12"
        side="double"
      ></a-text>
    </a-entity>

    <!--
      ============================================
      清水櫓(近景・推定復元)
      ============================================
      史実:清水曲輪(現・甲府駅周辺)の北西にあった二重櫓。
      別名「戌亥櫓」。二階に千鳥破風があったことが記録されている。
      甲府駅は清水曲輪の跡地にあたるため、この建物は
      「今、観光客が立っている場所のすぐ近く」にあった建造物として、
      「足元にタイムスリップ」体験の近景を担う中心的な要素。

      【確度:推定】
      清水櫓そのものの詳細な絵図・寸法は現時点で未確認。
      同時代・同型(二重櫓・千鳥破風あり)で実物復元済みの「稲荷櫓」を
      参考に、類似建造物として推定復元している。

      【座標について:象徴的配置】
      清水曲輪の正確な範囲・清水櫓の正確な位置を示す絵図は
      未特定のため、座標は「清水曲輪跡地(駅周辺)の象徴的な一点」
      として暫定配置している。現地調査・追加史料により更新予定。
    -->
    <a-entity
      gps-new-entity-place="latitude: 35.667900; longitude: 138.569700;"
      id="shimizu-yagura-placeholder"
    >
      <!-- 石垣土台 -->
      <a-box
        position="0 1 0"
        width="7" height="2" depth="7"
        color="#8a8478"
      ></a-box>
      <!-- 1階(木部) -->
      <a-box position="0 3.5 0" width="6" height="3" depth="6" color="#5a4632"></a-box>
      <!-- 2階(白漆喰、1階よりひと回り小さい) -->
      <a-box position="0 6 0" width="5" height="2.5" depth="5" color="#f5f2e9"></a-box>
      <!-- 千鳥破風(2階正面の小さな三角屋根アクセント) -->
      <a-cone
        position="0 7.6 2.6" radius-bottom="1.8" radius-top="0"
        height="1.2" segments-radial="4" rotation="0 45 0"
        color="#2b2b2b"
      ></a-cone>
      <!-- 大屋根(黒瓦、寄棟) -->
      <a-cone
        position="0 8 0" radius-bottom="4.5" radius-top="0"
        height="2" segments-radial="4" rotation="0 45 0"
        color="#2b2b2b"
      ></a-cone>
      <a-text
        value="清水櫓(推定復元・戌亥櫓)"
        position="0 10.5 0"
        align="center"
        color="#ffd166"
        width="12"
        side="double"
      ></a-text>
      <a-text
        value="※稲荷櫓を参考にした推定復元です"
        position="0 9.7 0"
        align="center"
        color="#ffd166"
        width="7"
        side="double"
      ></a-text>
    </a-entity>

    <!--
      ============================================
      清水曲輪 境界ライン(近景・推定・象徴表示)
      ============================================
      史実:清水曲輪の正確な区画を示す絵図は未特定。
      散策マップ等から得られる大まかな位置関係をもとに、
      「この辺りから城内でした」という体感的な境界を、
      半透明の帯として地面に表示する。ピンポイントの正確性は
      主張しない、あくまで象徴的な演出であることをラベルで明示。
    -->
    <a-entity id="shimizu-kuruwa-boundary">
      <a-entity gps-new-entity-place="latitude: 35.668100; longitude: 138.569900;">
        <a-box
          width="60" height="0.3" depth="3"
          rotation="0 30 0"
          color="#c94f4f"
          opacity="0.55"
          position="0 0.2 0"
        ></a-box>
        <a-text
          value="この辺りから先が、かつて甲府城「清水曲輪」の内側でした(推定・象徴表示)"
          position="0 2 0"
          align="center"
          color="#ffffff"
          width="10"
          side="double"
        ></a-text>
      </a-entity>
    </a-entity>

    <!--
      ============================================
      稲荷櫓(遠景・確定情報に基づく実座標)
      ============================================
      史実:実在が確認され、平成16年(2004年)に史実に基づき
      実物大で復元済み。座標は実際の稲荷櫓の位置(舞鶴城公園内)。
      一条小山の高台に位置するため、駅周辺からは「遠景」として
      見える想定。天守は非採用(4.3節参照)のため、
      遠景スカイラインの中心はこの稲荷櫓が担う。

      【確度:確定(建物の実在・場所)/推定(仮モデルの外観)】
    -->
    <a-entity
      gps-new-entity-place="latitude: 35.665948; longitude: 138.572013;"
      id="inari-yagura-placeholder"
    >
      <!-- 石垣土台(高台の上にあることを表現するため高めに設定) -->
      <a-box
        position="0 4 0"
        width="9" height="8" depth="9"
        color="#8a8478"
      ></a-box>
      <!-- 1階(木部) -->
      <a-box position="0 9.5 0" width="8" height="3" depth="8" color="#5a4632"></a-box>
      <!-- 2階(白漆喰) -->
      <a-box position="0 12.3 0" width="6.5" height="2.6" depth="6.5" color="#f5f2e9"></a-box>
      <!-- 大屋根(黒瓦) -->
      <a-cone
        position="0 14.2 0" radius-bottom="6" radius-top="0"
        height="2.6" segments-radial="4" rotation="0 45 0"
        color="#2b2b2b"
      ></a-cone>
      <a-text
        value="稲荷櫓(実在・復元済み/遠景)"
        position="0 17 0"
        align="center"
        color="#a8e6a1"
        width="14"
        side="double"
      ></a-text>
    </a-entity>
  </a-scene>

  <script>
    document.getElementById('start-button').addEventListener('click', () => {
      // モーションセンサーの許可リクエストが必要な端末(iOS 13+)だけ、
      // 先に日本語の説明モーダルを見せる
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        document.getElementById('permission-explainer').style.display = 'flex';
      } else {
        startAR();
      }
    });

    document.getElementById('proceed-button').addEventListener('click', async () => {
      document.getElementById('permission-explainer').style.display = 'none';

      try {
        const permState = await DeviceOrientationEvent.requestPermission();
        if (permState !== 'granted') {
          alert(
            '方位センサーの利用が許可されませんでした。\n\n' +
            '許可し直すには、Safari画面左上の「aA」アイコン → ' +
            '「Webサイトの設定」から、このサイトの設定をリセットして、' +
            'ページを再読み込みしてください。'
          );
          return;
        }
      } catch (e) {
        console.error(e);
        return;
      }

      startAR();
    });

    function startAR() {
      document.getElementById('start-button').style.display = 'none';
      document.getElementById('ar-scene').style.display = 'block';

      // カメラ映像を最大限見せるため、説明パネルは自動的に折りたたむ
      const infoPanel = document.getElementById('info-panel');
      const infoToggle = document.getElementById('info-toggle');
      infoPanel.classList.add('collapsed');
      infoToggle.classList.add('visible');

      infoToggle.addEventListener('click', () => {
        infoPanel.classList.toggle('collapsed');
      });

      // カメラ映像(video要素)が実際に流れているかを監視し、
      // 問題があれば画面上に理由を表示する(デバッグ用)
      let checkCount = 0;
      const cameraCheckInterval = setInterval(() => {
        checkCount++;
        const video = document.querySelector('#ar-scene video');
        const statusEl = document.getElementById('camera-status');

        if (!video) {
          statusEl.innerText = `カメラ映像の要素が見つかりません(確認中... ${checkCount})`;
        } else if (video.readyState < 2) {
          statusEl.innerText = `カメラ映像を読み込み中です(readyState: ${video.readyState})`;
        } else if (video.videoWidth === 0) {
          statusEl.innerText = 'カメラ映像のサイズが0です。カメラ許可を確認してください。';
        } else {
          statusEl.innerText = '';
          statusEl.style.display = 'none';
          clearInterval(cameraCheckInterval);
        }

        if (checkCount > 20) {
          clearInterval(cameraCheckInterval);
        }
      }, 500);

      // 簡易的な距離表示(現在地から各ARオブジェクト座標までの距離)
      const targets = [
        { name: '山手御門(導線)', lat: 35.667226, lng: 138.570866 },
        { name: '清水櫓(近景)', lat: 35.667900, lng: 138.569700 },
        { name: '稲荷櫓(遠景)', lat: 35.665948, lng: 138.572013 }
      ];

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
          const lines = targets.map((t) => {
            const dist = getDistanceMeters(
              pos.coords.latitude, pos.coords.longitude,
              t.lat, t.lng
            );
            return `${t.name}:約${dist.toFixed(0)}m`;
          });
          document.getElementById('distance-indicator').innerHTML = lines.join('<br>');
        }, (err) => {
          console.error(err);
        }, { enableHighAccuracy: true });
      }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (deg) => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
  </script>

</body>
</html>
